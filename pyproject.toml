[project]
name = "asimovbm"
version = "0.1.0"
description = "Local-first Paper HRI benchmark validation artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
g1-mujoco = [
  "imageio>=2.0",
  "mujoco>=3.2.0,<3.4.0",
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.7",
]

[project.scripts]
asimovbm-local = "asimovbm.local_runner.cli:main"
asimovbm-unity = "asimovbm.local_runner.unity_runner:main"
asimovbm-web = "asimovbm.web.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "g1_slam/src"]

[tool.setuptools.package-data]
asimovbm = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "g1_slam/src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "g1_slam/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
