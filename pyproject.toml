[project]
name = "asimovbm"
version = "0.1.0"
description = "Paper HRI benchmark client and server artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "websockets>=13.0",
]
client-transport = [
  "websockets>=13.0",
]
g1-mujoco = [
  "mujoco>=3.2.0",
  "numpy>=1.26",
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.7",
]

[project.scripts]
asimovbm-client = "asimovbm_client.cli:main"
asimovbm-server = "asimovbm_server.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "g1_slam/src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
